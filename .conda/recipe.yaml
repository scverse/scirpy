package:
  name: scirpy
  version: develop

source:
  path: ".."

build:
  number: 0
  noarch: python
  script: python -m pip install . --ignore-installed --no-deps -vv

requirements:
  host:
    - python >=3.13
    - pip
    - hatchling
    - hatch-vcs

  run:
    - python >=3.13
    - adjusttext >=0.7
    - airr >=1.6.1
    - anndata >=0.12
    - awkward >=2.6.8
    - python-igraph >=0.11.9
    - joblib >=1.5.0
    - logomaker !=0.8.5
    - mudata >=0.3.2
    - networkx >=3.4
    - numba >=0.61
    - numpy >=2.1.0
    - pandas >=2.3.0
    - pooch >=1.7.0
    - python-levenshtein >=0.26.0
    - scanpy >=1.12
    - scikit-learn >=1.5.2
    - scipy >=1.14.1
    - scverse-misc >=0.1.3
    - squarify >=0.2
    - tqdm >=4.63

tests:
  - python:
      imports:
        - scirpy
  - script:
      - pytest --pyargs scirpy -m "not extra and not gpu"
    requirements:
      run:
        - hatch-vcs
        - pytest !=9.1.0
        - leidenalg
        - jupytext
        - pycairo
        - jupyter_client
        - ipykernel
        - nbconvert
        - muon >=0.1.5
    files:
      source:
        - docs

about:
  homepage: https://scirpy.scverse.org
  repository: https://github.com/scverse/scirpy
  license: BSD-3-Clause
  summary: A Scanpy extension for analyzing single-cell T-cell receptor sequencing data.

extra:
  identifiers:
    - doi:10.1101/2020.04.10.035865
